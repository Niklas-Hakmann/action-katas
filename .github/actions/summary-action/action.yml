name: "Summary Action"
description: "Computes a summary of a list of numbers"

inputs:
  numbers:
    description: "JSON array of numbers as a string"
    required: true
    default: "[1,2,3]"

outputs:
  summary:
    description: "Summary produced by the composite action (JSON)"
    value: ${{ steps.compute.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Compute summary
      id: compute
      shell: bash
      run: |
        summary=$(printf '%s' '${{ inputs.numbers }}' | python3 ${{ github.action_path }}/../../../ci/compute_summary.py)
        echo "summary=$summary" >> $GITHUB_OUTPUT
